<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>模拟股市</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0f14;color:#e6edf3;font:14px/1.5 -apple-system,"PingFang SC",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
input{font:inherit;color:#e6edf3;background:#0f151d;border:1px solid #1e2937;border-radius:8px;padding:9px;width:100%;outline:none}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #1e2937;background:#0b0f14;position:sticky;top:0;z-index:5}
.hd b{font-size:16px}.hd small{display:block;color:#7d8b9c;font-size:10px;font-weight:400}
.ix{text-align:right;font-size:12px}.ix .s{display:block;color:#7d8b9c;font-size:10px}
.ctrl{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid #1e2937;background:#0e141c}
.ctrl button{flex:1;padding:8px 0;border-radius:8px;background:#1a2432;border:1px solid #1e2937;color:#c9d4e0;font-size:12px}
.ctrl button:active{background:#243040}
.pg{display:none;padding:12px 12px 72px}.pg.on{display:block}
.c{background:#141b24;border:1px solid #1e2937;border-radius:12px;padding:12px;margin-bottom:10px}
.r{color:#ff5252}.g{color:#00d09c}.s{color:#7d8b9c}.m{font-variant-numeric:tabular-nums}
.w{display:flex;align-items:center;padding:10px 2px;border-bottom:1px solid #1a2432}.w:last-child{border-bottom:0}
.w .l{flex:1;min-width:0}.w .n{font-size:15px}.w .cd{font-size:11px;color:#7d8b9c}
.w .rt{text-align:right}.w .p{font-size:16px;font-weight:600}.w .pc{font-size:11px}
.btn{background:#e8b339;color:#1a1300;border-radius:8px;padding:9px 14px;font-weight:600}
.btn.g2{background:#1a2432;color:#e6edf3;border:1px solid #1e2937}
.sr{display:flex;gap:8px;margin-bottom:10px}.sr input{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:8px;background:#131b25;color:#7d8b9c;font-size:13px}
.tabs button.on{background:#e8b339;color:#1a1300;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e141c;border-top:1px solid #1e2937;z-index:9}
.nav button{flex:1;padding:9px 0;font-size:11px;color:#7d8b9c}.nav button.on{color:#e8b339}
#dt{position:fixed;inset:0;background:#0b0f14;z-index:20;transform:translateX(102%);transition:.2s;overflow:auto;padding-bottom:24px}
#dt.on{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #1e2937;position:sticky;top:0;background:#0b0f14;z-index:2}
.dh b{flex:1}.dh button{font-size:22px;color:#7d8b9c}
.q{padding:10px 16px}.qp{font-size:28px;font-weight:700}.qc{font-size:13px}
.qm{font-size:11px;color:#7d8b9c;margin-top:6px}
.tabs2{display:flex;gap:6px;padding:6px 12px}
.tabs2 button{padding:5px 14px;border-radius:14px;background:#131b25;color:#7d8b9c;font-size:12px}
.tabs2 button.on{background:#e8b339;color:#1a1300}
canvas{display:block;width:100%;height:230px}
.lv{display:flex;justify-content:space-between;font-size:12px;padding:3px 16px}
.lv span:nth-child(2){flex:1;text-align:right;margin-right:18px}
.f{padding:10px 12px}.f .ln{display:flex;gap:8px;margin-bottom:8px}
.f .acts{display:flex;gap:8px;margin-top:8px}
.f .acts button{flex:1;padding:11px;border-radius:10px;font-size:15px;font-weight:600}
.buy{background:#ff5252;color:#fff}.sell{background:#00d09c;color:#04241b}
.ghost{background:#1a2432;color:#e6edf3;border:1px solid #1e2937}
.oh{font-size:13px;color:#7d8b9c;margin:8px 0 4px}
.od{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a2432;font-size:12px}
.od button{border:1px solid #1e2937;border-radius:6px;padding:3px 9px;font-size:11px;color:#7d8b9c}
.st{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}.st .k{color:#7d8b9c}
.big{font-size:25px;font-weight:700}
#ts{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1e2834;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:82vw;text-align:center;z-index:99}
#ts.on{opacity:1}
.ta{width:100%;height:80px;background:#0f151d;border:1px solid #1e2937;border-radius:8px;color:#e6edf3;padding:8px;font:12px monospace}
.note{font-size:11px;color:#7d8b9c;line-height:1.6}
.emp{text-align:center;color:#7d8b9c;padding:22px 0;font-size:13px}
</style>
</head>
<body>
<div class="hd">
 <div><b>模拟股市</b><small id="hTime">--</small></div>
 <div class="ix"><span id="hIndex">--</span><span class="s">模拟上证指数</span></div>
</div>

<div class="ctrl">
 <button id="btnPause">⏸ 暂停</button>
 <button id="btnEnd">收盘结算</button>
 <button id="btnNext">下一天</button>
</div>

<div class="pg on" id="p1">
 <div class="sr"><input id="q" placeholder="代码或名称，如 600519"><button class="btn" id="add">添加</button></div>
 <div class="c" id="wl"></div>
</div>

<div class="pg" id="p2">
 <div class="tabs"><button id="bUp" class="on">涨幅榜</button><button id="bDown">跌幅榜</button></div>
 <div class="c" id="bl"></div>
</div>

<div class="pg" id="p3">
 <div class="c"><div class="oh">持仓</div><div id="pl"></div></div>
 <div class="c"><div class="oh">委托</div><div id="ol"></div></div>
</div>

<div class="pg" id="p4">
 <div class="c">
  <div class="st"><span class="k">总资产</span><span class="big m" id="t1">--</span></div>
  <div class="st"><span class="k">可用资金</span><span class="m" id="t2">--</span></div>
  <div class="st"><span class="k">冻结资金</span><span class="m" id="t3">--</span></div>
  <div class="st"><span class="k">累计盈亏</span><span class="m" id="t4">--</span></div>
 </div>
 <div class="c">
  <div class="oh">资金设置</div>
  <div class="sr"><input id="cap" type="number" placeholder="资金（万元），如 10000 = 1 亿"><button class="btn" id="setcap">设置</button></div>
  <div class="note">设置后可用资金变更，所有挂单会被撤销。</div>
 </div>
 <div class="c">
  <div class="oh">对账与备份</div>
  <button class="btn g2" id="ck" style="width:100%;margin-bottom:8px">检查资金与持仓</button>
  <textarea class="ta" id="bk" placeholder="导出后长按复制；粘贴备份后点导入"></textarea>
  <div class="f"><div class="acts"><button class="btn g2" id="ex">导出</button><button class="btn" id="im">导入</button></div></div>
 </div>
 <div class="c note">规则：T+1 · 买入100股整数倍 · 佣金万2.5（最低5元）· 印花税卖出0.05% · 过户费0.001%<br>价格由引擎生成，成交会真实冲击市场。</div>
 <button class="btn g2" id="rs" style="width:100%">重置账户</button>
</div>

<nav class="nav">
 <button class="on" data-p="1">★ 自选</button>
 <button data-p="2">▤ 行情</button>
 <button data-p="3">◈ 持仓</button>
 <button data-p="4">☰ 我的</button>
</nav>

<div id="dt">
 <div class="dh"><button id="bk2">‹</button><b id="dn">--</b></div>
 <div class="q"><div class="qp m" id="dp">--</div><div class="qc m" id="dc"></div><div class="qm" id="dm"></div></div>
 <div class="tabs2"><button class="ct on" data-c="t">分时</button><button class="ct" data-c="k">日K</button></div>
 <canvas id="cv"></canvas>
 <div id="lv"></div>
 <div class="f">
  <div class="ln"><input id="ip" type="number" step="0.01" placeholder="价格"><input id="iq" type="number" step="1" placeholder="手数"></div>
  <div class="note" id="fi">--</div>
  <div class="acts"><button class="buy" id="bbNow">现价买入</button><button class="sell" id="bsNow">现价卖出</button></div>
  <div class="acts"><button class="ghost" id="bbLimit">挂单买入</button><button class="ghost" id="bsLimit">挂单卖出</button></div>
 </div>
</div>

<div id="ts"></div>

<script>
window.onerror=function(m,s,l){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;padding:8px;font-size:12px;z-index:999';d.textContent='错误：'+m+' 第'+l+'行';document.body.appendChild(d);return false};
</script>
<script>
(function(){
 var fs=['stocks.js','engine.js','trade.js','app.js','fix2.js'],t=Date.now();
 for(var i=0;i<fs.length;i++){document.write('<script src="'+fs[i]+'?v='+t+'"><\/script>');}
})();
</script>
</body>
</html>
