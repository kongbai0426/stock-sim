<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>模拟股市</title>
<style>
:root{--bg:#0b0f14;--card:#131b25;--line:#1e2937;--fg:#e6edf3;--dim:#7d8b9c;--r:#ff5252;--g:#00d09c;--y:#e8b339}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
input{font:inherit;color:var(--fg);background:#0f151d;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;outline:none}
input:focus{border-color:#2f4a6b}
.r{color:var(--r)}.g{color:var(--g)}.s{color:var(--dim)}.m{font-variant-numeric:tabular-nums}

/* 顶栏 */
.hd{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1620,#0b0f14)}
.hd b{font-size:16px;letter-spacing:.4px}
.hd small{display:block;color:var(--dim);font-size:10px;font-weight:400;margin-top:1px}
.ix{text-align:right}
.ix .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.ix .s{display:block;color:var(--dim);font-size:9.5px}

/* 控制条 */
.ctrl{flex:0 0 auto;display:flex;gap:7px;padding:7px 12px;border-bottom:1px solid var(--line);background:#0e141c}
.ctrl button{flex:1;padding:7px 0;border-radius:8px;background:#1a2432;border:1px solid var(--line);color:#c9d4e0;font-size:12px}
.ctrl button:active{background:#233043}

/* 页面 */
.pg{display:none;flex:1;overflow-y:auto;padding:10px 11px 12px;-webkit-overflow-scrolling:touch}
.pg.on{display:block}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:9px}
.oh{font-size:11px;color:var(--dim);margin:9px 0 3px;letter-spacing:.5px}
.btn{background:var(--y);color:#1a1300;border-radius:8px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn.g2{background:#1a2432;color:var(--fg);border:1px solid var(--line)}
.sr{display:flex;gap:8px;margin:8px 0}
.sr input{flex:1}
.tabs{display:flex;gap:7px;margin:8px 0}
.tabs button{flex:1;padding:7px 0;border-radius:8px;background:#131b25;border:1px solid var(--line);color:var(--dim);font-size:12.5px}
.tabs button.on{background:var(--y);color:#1a1300;font-weight:600;border-color:var(--y)}

/* 列表项（app.js 生成） */
.w{display:flex;align-items:center;padding:9px 2px;border-bottom:1px solid #18202b}
.w:last-child{border-bottom:0}
.w:active{background:#18212c}
.w .l{flex:1;min-width:0}
.w .n{font-size:14.5px}
.w .cd{font-size:10.5px;color:var(--dim);margin-top:1px}
.w .rt{text-align:right}
.w .p{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.w .pc{font-size:10.5px;font-variant-numeric:tabular-nums}
.emp{text-align:center;color:var(--dim);padding:22px 0;font-size:13px}

/* 资产 */
.st{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid #18202b;font-size:13px}
.st:last-child{border-bottom:0}
.st .k{color:var(--dim)}
.big{font-size:24px;font-weight:700}
.note{font-size:10.5px;color:var(--dim);line-height:1.65;padding:6px 2px}
.ta{width:100%;height:76px;background:#0f151d;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px;font:11px monospace}

/* 委托 */
.od{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #18202b;font-size:11.5px;gap:6px}
.od:last-child{border-bottom:0}
.od button{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:10.5px;color:var(--dim)}

/* 底部导航 */
.nav{flex:0 0 auto;display:flex;background:#0e141c;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:8px 0 7px;font-size:10.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button b{font-size:15px;font-weight:400;line-height:1}
.nav button.on{color:var(--y)}

/* 详情页 */
#dt{position:fixed;inset:0;background:var(--bg);z-index:20;transform:translateX(102%);transition:.2s;display:flex;flex-direction:column}
#dt.on{transform:none}
.dh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1620,#0b0f14)}
.dh button{font-size:20px;color:var(--dim);width:26px;text-align:left}
.dh b{flex:1;font-size:14.5px}
.dtBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* 报价区 */
.qb2{padding:8px 14px 6px;display:flex;align-items:flex-start;gap:10px}
.qb2 .left{flex:0 0 auto;min-width:112px}
.qp{font-size:29px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.qc{font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:1px}
.qm{flex:1;font-size:10px;color:var(--dim);line-height:1.7;text-align:right}
.tabs2{display:flex;gap:6px;padding:4px 12px 6px}
.tabs2 button{padding:4px 15px;border-radius:13px;background:#131b25;border:1px solid var(--line);color:var(--dim);font-size:12px}
.tabs2 button.on{background:var(--y);color:#1a1300;border-color:var(--y);font-weight:600}
canvas{display:block;width:100%;height:230px}
#idxCv{height:200px}

/* 五档 */
#lv{padding:2px 12px 4px}
.lv{display:flex;justify-content:space-between;font-size:12px;padding:3px 2px;font-variant-numeric:tabular-nums;border-bottom:1px solid rgba(30,41,55,.5)}
.lv:last-child{border-bottom:0}
.lv span:nth-child(1){color:var(--dim);min-width:34px;font-size:11px}
.lv span:nth-child(2){flex:1;text-align:right;margin-right:20px}
.lv span:nth-child(3){min-width:52px;text-align:right;color:#b7c4d2}

/* 底部交易区 */
.dtFoot{flex:0 0 auto;background:#0e141c;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.dtFoot .ln{display:flex;gap:8px;margin-bottom:6px}
.dtFoot .ln input{flex:1}
.dtFoot .fi{font-size:10px;color:var(--dim);margin-bottom:6px}
.acts{display:flex;gap:8px;margin-top:6px}
.acts button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:600}
.buy{background:var(--r);color:#fff}
.sell{background:var(--g);color:#04241b}
.ghost{background:#1a2432;color:var(--fg);border:1px solid var(--line)}

#ts{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1e2834;padding:9px 14px;border-radius:9px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;max-width:84vw;text-align:center;z-index:99;border:1px solid var(--line)}
#ts.on{opacity:1}
</style>
</head>
<body>

<div class="hd">
<div><b>模拟股市</b><small id="hTime">--</small></div>
<div class="ix"><span class="v m" id="hIndex">--</span><span class="s">模拟上证指数</span></div>
</div>

<div class="ctrl">
<button id="btnPause">⏸ 暂停</button>
<button id="btnEnd">收盘结算</button>
<button id="btnNext">下一天</button>
</div>

<div class="pg on" id="p1">
<div class="sr"><input id="q" placeholder="代码或名称，如 600519"><button class="btn" id="add">添加</button></div>
<div class="c" id="wl"></div>
</div>

<div class="pg" id="p2">
<div class="tabs"><button id="tabRank" class="on">涨跌榜</button><button id="tabSec">板块指数</button></div>
<div id="rankWrap">
<div class="tabs"><button id="bUp" class="on">涨幅榜</button><button id="bDown">跌幅榜</button></div>
<div class="c" id="bl"></div>
</div>
<div id="secWrap" style="display:none">
<div class="c">
<div class="oh"><span id="idxTitle">上证指数</span> <span id="idxVal" class="m"></span>
<button id="secBack" style="display:none;float:right;color:var(--y);font-size:11px">返回板块</button></div>
<canvas id="idxCv"></canvas>
</div>
<div class="c"><div id="secList"></div></div>
</div>
</div>

<div class="pg" id="p3">
<div class="c"><div class="oh">持仓</div><div id="pl"></div></div>
<div class="c"><div class="oh">委托</div><div id="ol"></div></div>
</div>

<div class="pg" id="p4">
<div class="c">
<div class="st"><span class="k">总资产</span><span class="big m" id="t1">--</span></div>
<div class="st"><span class="k">可用资金</span><span class="m" id="t2">--</span></div>
<div class="st"><span class="k">冻结资金</span><span class="m" id="t3">--</span></div>
<div class="st"><span class="k">累计盈亏</span><span class="m" id="t4">--</span></div>
</div>
<div class="c">
<div class="oh">资金设置</div>
<div class="sr"><input id="cap" type="number" placeholder="资金（万元），如 10000 = 1 亿"><button class="btn" id="setcap">设置</button></div>
<div class="note">设置后可用资金变更，所有挂单会被撤销。</div>
</div>
<div class="c">
<div class="oh">对账与备份</div>
<button class="btn g2" id="ck" style="width:100%;margin-bottom:8px">检查资金与持仓</button>
<textarea class="ta" id="bk" placeholder="导出后长按复制；粘贴备份后点导入"></textarea>
<div class="acts" style="margin-top:8px"><button class="btn g2" id="ex">导出</button><button class="btn" id="im">导入</button></div>
</div>
<div class="c note">规则：T+1 · 买入100股整数倍 · 佣金万2.5（最低5元）· 印花税卖出0.05% · 过户费0.001%<br>价格由引擎生成，成交会真实冲击市场。</div>
<button class="btn g2" id="rs" style="width:100%">重置账户</button>
</div>

<nav class="nav">
<button class="on" data-p="1"><b>★</b>自选</button>
<button data-p="2"><b>▤</b>行情</button>
<button data-p="3"><b>◈</b>持仓</button>
<button data-p="4"><b>☰</b>我的</button>
</nav>

<div id="dt">
<div class="dh"><button id="bk2">‹</button><b id="dn">--</b></div>
<div class="dtBody">
<div class="qb2">
<div class="left">
<div class="qp m" id="dp">--</div>
<div class="qc m" id="dc"></div>
</div>
<div class="qm" id="dm"></div>
</div>
<div class="tabs2"><button class="ct on" data-c="t">分时</button><button class="ct" data-c="k">日K</button></div>
<canvas id="cv"></canvas>
<div id="lv"></div>
</div>
<div class="dtFoot">
<div class="ln"><input id="ip" type="number" step="0.01" inputmode="decimal" placeholder="价格"><input id="iq" type="number" step="1" inputmode="numeric" placeholder="手数"></div>
<div class="fi" id="fi">--</div>
<div class="acts"><button class="buy" id="bbNow">现价买入</button><button class="sell" id="bsNow">现价卖出</button></div>
<div class="acts"><button class="ghost" id="bbLimit">挂单买入</button><button class="ghost" id="bsLimit">挂单卖出</button></div>
</div>
</div>

<div id="ts"></div>

<script>
window.onerror=function(m,s,l){
 var d=document.createElement('div');
 d.style.cssText='position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;padding:8px;font-size:12px;z-index:999;word-break:break-all';
 var f=(s||'').split('/').pop();
 d.textContent='错误：'+m+' 第'+l+'行'+(f?' @'+f:'');
 document.body.appendChild(d);return false;
};
</script>
<script>
(function(){
 var fs=['stocks.js','engine.js','trade.js','app.js','fix2.js','sector.js','multi.js','volfix.js','flow.js','clock.js','klinefix.js','axis.js','fmt.js','tradepanel.js','head.js','pos.js','tape.js','mink.js','mood.js','ob.js','detail.js','book5.js','layout.js'],t=Date.now();
 for(var i=0;i<fs.length;i++){document.write('<script src="'+fs[i]+'?v='+t+'"><\/script>');}
})();
</script>
</body>
</html>
